[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vue-i18n-python"
dynamic = ["version"]
description = "An unofficial Python port of vue-i18n: same JSON message files, same API, same behaviour."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jure Erznožnik", email = "jure.erznoznik@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["i18n", "l10n", "translation", "vue-i18n", "cldr", "plural"]
classifiers = [
    # The *format* is not ours to version: it is vue-i18n's, and this package tracks it. The package
    # version below is the package's own, and it is alpha because nothing here has been through a
    # real deployment yet - 1.0 is what the first confirmed production use earns, not what a
    # complete conformance corpus earns.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Typing :: Typed",
]
# The compiler and the runtime have no dependencies at all: a message is parsed and interpreted by
# code in this package. `babel` enters only for `d()` and `n()`, which need CLDR date and number
# data that Python does not ship - see the `intl` extra.
dependencies = []

[project.optional-dependencies]
# `d()` and `n()` are the JS `Intl.DateTimeFormat` / `Intl.NumberFormat` counterparts. Their option
# objects travel in the message resource as plain data and cost nothing; rendering them needs CLDR,
# which is what babel brings. Everything else in this package works without it.
intl = ["babel>=2.14"]
dev = [
    "coverage",
    "pytest",
    "pytest-cov",
    "babel",
    # Pinned to a major, because the lint config below is read against a specific rule set: an older
    # ruff on `PATH` reports rules this one has since retired, and the difference looks like a
    # regression in the code rather than in the tool.
    "ruff>=0.16",
    # `vue_i18n/packaging_test.py` builds a real wheel and reads its member list, because a test
    # that checks the manifest cannot see what hatch actually put in the artefact. Without this the
    # test skips, and a skip is indistinguishable from a pass. `hatchling` is the build backend
    # named in `[build-system]`; having it here too lets that test build without an isolated
    # environment, which keeps it offline and repeatable.
    "build",
    "hatchling",
]

[tool.publish]
# Nothing gets published until these have run and passed. Named explicitly because the tests sit
# beside the code as `<module>_test.py` rather than under `tests/`, so no amount of directory
# sniffing would have found them - and a release that skipped them silently is the failure this
# line exists to prevent.
tests = "pytest"

[project.urls]
Homepage = "https://github.com/velis74/vue-i18n-python"
Repository = "https://github.com/velis74/vue-i18n-python"
Issues = "https://github.com/velis74/vue-i18n-python/issues"
Documentation = "https://docs.velis.si/vue-i18n-python/"

[tool.hatch.version]
path = "vue_i18n/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vue_i18n"]
# Tests live next to the code, so without this every installed copy carries the suite into
# site-packages - where it cannot run anyway, because the corpora it reads are not in the wheel.
# `packaging_test.py` builds a real wheel and asserts this, since the manifest is not something
# the source tree can be read for.
exclude = [
    "**/*_test.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "/vue_i18n",
    "/conformance",
    "/CHANGELOG.md",
    "/SPEC.md",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/*_test.py",
]

[tool.ruff]
exclude = ['tests', 'docs', 'examples', 'scripts', 'setup.py', 'setup.cfg', 'README.md', 'LICENSE',
    'MANIFEST.in', 'pyproject.toml', 'dist', 'build', '.gitignore', '.git', '.idea', '.vscode',
    '.pytest_cache', '.coverage', '.ruff']
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "Q",    # flake8-quotes
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "PT",   # flake8-pytest-style
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
]
ignore = ["E731", "E722", "C408"]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
# The generated plural-rule module is a data table with one function per rule, and its names come
# from CLDR rather than from PEP 8. Each rule's docstring lists every locale that shares it, which
# runs well past the line limit.
"vue_i18n/plurals/_generated.py" = ["N802", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = false
lines-between-types = 1
combine-as-imports = true
order-by-type = false

[tool.coverage.run]
omit = ["test_*.py", "*_test.py"]
